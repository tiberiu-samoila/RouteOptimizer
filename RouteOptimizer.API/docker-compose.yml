version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: BusRouteOptimizer
      POSTGRES_USER: busroute_user
      POSTGRES_PASSWORD: YourSecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # No init script is mounted: ./scripts/init-db.sql does not exist in this
      # repository, and Docker would silently create a DIRECTORY with that name
      # inside /docker-entrypoint-initdb.d. The API creates the schema itself at
      # startup (Program.cs: EnsureCreated + Migrate).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      # The repository root: the API references RouteOptimizer.Infrastructure,
      # which references RouteOptimizer.Core, so the context has to include all
      # three projects. (It used to point at ../BusRouteOptimizer.API/Dockerfile,
      # a path that does not exist in this repository.)
      context: ..
      dockerfile: RouteOptimizer.API/Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=BusRouteOptimizer;Username=busroute_user;Password=YourSecurePassword123!
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./ml-models:/app/ml-models
    # /health is mapped in Program.cs and checks the database and Redis too, so
    # "healthy" means the API is genuinely ready for a test to hit it. This is
    # what `docker compose up -d --wait api` waits for; start_period covers the
    # EnsureCreated + Migrate the API runs on boot.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ../BusRouteOptimizer.Web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:5000/api
      - REACT_APP_MAPBOX_TOKEN=your_mapbox_token
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data: